<html>
<head>
<title>AyuAI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#171717">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<!-- Mobile backdrop (tap to close sidebar) -->
<div class="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-header">
      <button class="sidebar-size-toggle" onclick="toggleSidebarSize()" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg class="collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="new-btn" onclick="newChat()">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New Chat</span>
      </button>
      
    </div>

    <div class="sidebar-mode-section">
      <div class="sidebar-section-label">Mode</div>
      <div class="mode-buttons">
        <button class="mode-btn efficient-btn" onclick="setMode('efficient')" title="Efficient mode">
          <span class="mode-icon">⚡</span><span class="mode-label">Efficient</span>
        </button>
        <button class="mode-btn smart-btn" onclick="setMode('smart')" title="Smart mode">
          <span class="mode-icon">🧠</span><span class="mode-label">Smart</span>
        </button>
      </div>
    </div>

    <div class="sidebar-search" onclick="toggleChatSearch(event)">
      <button class="search-toggle" title="Search chats" aria-label="Search chats" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </button>
      <input id="chat-search" type="search" placeholder="Search chats" aria-label="Search chats">
    </div>

    <div class="sidebar-section-label pinned-label">Pinned</div>
    <div id="pinned-list" class="chat-list pinned-list"></div>
    <div class="sidebar-section-label">Recent</div>
    <div id="chat-list" class="chat-list"></div>
  </div>

  <div class="footer">
    Made by Abhay Pratap
  </div>
</div>

<div id="settings-panel" class="settings-panel" aria-hidden="true">
  <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-heading"><h2 id="settings-title">Settings</h2><button onclick="toggleSettings()" title="Close settings" aria-label="Close settings">&times;</button></div>
    <label class="setting-row"><span>Compact mode</span><input id="compact-setting" type="checkbox"></label>
    <label class="setting-row"><span>Reduce motion</span><input id="motion-setting" type="checkbox"></label>
    <label class="setting-row"><span>Message density</span><select id="density-setting"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label>
  </div>
</div>

<!-- Chat -->
<div class="chat">

  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()" title="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="logo">
        <img src="logo.svg">
        <span>AyuAI</span>
      
      </div>
    </div>
    <button class="settings-btn" onclick="toggleSettings()" title="Settings" aria-label="Open settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6v-2.6h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5h2.6v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0-1.6 1h.2v2.6h-.2a1.7 1.7 0 0 0-1.6 1z"></path></svg>
    </button>

  </div>

  <div id="messages">
    <div class="empty-state">
      <img src="logo.svg" class="empty-logo">
      <h1>How can I assist you today?</h1>
    </div>
  </div>

  <div class="composer">
    <div class="input-box">
      <input id="input" placeholder="Message AyuAI...">
      <button class="mic" onclick="startVoice()" title="Voice input" aria-label="Voice input">
        <span class="mic-icon"><i></i><i></i><i></i><i></i><i></i></span>
      </button>
      <button class="send-btn" onclick="send()" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
    <div class="disclaimer">AyuAI  isn't human. It can make mistakes, Check important info.</div>
  </div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
