<html>
<head>
<title>AyuAI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:#343541;
  color:white;
  font-family:system-ui;
}

/* Layout */
.app { display:flex; height:100vh; }

/* Sidebar */
.sidebar {
  width:260px;
  background:#202123;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.new-btn {
  width:100%;
  padding:10px;
  background:#343541;
  border:1px solid #555;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* Chat */
.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Topbar */
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border-bottom:1px solid #444;
}

/* Logo */
.logo {
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img {
  width:35px;
  height:35px;
  border-radius:6px;
}

/* Messages */
#messages {
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.msg {
  max-width:800px;
  width:100%;
  margin:auto;
  padding:15px;
  border-radius:10px;
  line-height:1.6;
  white-space:pre-wrap;
  word-spacing:2px;
}

.user-msg { background:#444654; }
.bot-msg { background:#343541; }

/* Input */
.input-box {
  display:flex;
  padding:15px;
  background:#40414f;
}

.input-box input {
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#343541;
  color:white;
}

/* Buttons */
button {
  margin-left:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#10a37f;
  color:white;
  cursor:pointer;
}

.mic { background:#ef4444; }

/* Footer */
.footer {
  font-size:12px;
  text-align:center;
  opacity:0.6;
}

/* Mobile */
@media (max-width:768px){
  .sidebar { display:none; }
}
</style>
</head>

<body>

<div class="app">

<!-- Sidebar -->
<div class="sidebar">
  <div>
    <button class="new-btn" onclick="newChat()">+ New Chat</button>
  </div>

  <div class="footer">
    Made by Abhay Pratap 
  </div>
</div>

<!-- Chat -->
<div class="chat">

  <div class="topbar">
    <div class="logo">
      <img src="logo.png">
      <span>AyuAI </span>
    </div>

    <div>
      <button onclick="setMode('efficient')">⚡</button>
      <button onclick="setMode('smart')">🧠</button>
    </div>
  </div>

  <div id="messages"></div>

  <div class="input-box">
    <input id="input" placeholder="Message AyuAI...">
    <button onclick="send()">Send</button>
    <button class="mic" onclick="startVoice()">🎤</button>
  </div>

</div>
</div>

<script>
let history = [];
let memory = [];
let currentMode = "efficient";

/* MODE */
function setMode(mode){
  currentMode = mode;
}

/* SEND */
async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text,"user-msg");
  input.value="";

  history.push({role:"user",content:text});
  memory.push({role:"user",content:text});

  try{
    const res = await fetch("/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        message:text,
        mode:currentMode,
        history:[...memory]
      })
    });

    const data = await res.json();

    history.push({role:"assistant",content:data.reply});
    memory.push({role:"assistant",content:data.reply});

    addMessage(data.reply,"bot-msg",true);

  }catch{
    addMessage("⚠️ Error","bot-msg");
  }
}

/* MESSAGE with typing */
function addMessage(text,type,typing=false){
  const div = document.createElement("div");
  div.className = "msg " + type;

  document.getElementById("messages").appendChild(div);

  const box = document.getElementById("messages");

  if(typing){
    let i=0;
    function typeEffect(){
      if(i < text.length){
        div.innerText += text.charAt(i);
        i++;
        box.scrollTop = box.scrollHeight;
        setTimeout(typeEffect,10);
      }
    }
    typeEffect();
  } else {
    div.innerText = text;
  }

  box.scrollTop = box.scrollHeight;
}

/* ENTER */
document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key==="Enter") send();
});

/* 🎤 VOICE INPUT ONLY (NO AI SPEAK) */
function startVoice(){
  if(!('webkitSpeechRecognition' in window)){
    alert("Voice not supported");
    return;
  }

  const rec = new webkitSpeechRecognition();
  rec.lang="en-US";

  rec.onresult = (e)=>{
    document.getElementById("input").value =
      e.results[0][0].transcript;
  };

  rec.start();
}

/* NEW CHAT (memory stays) */
function newChat(){
  history = [];
  document.getElementById("messages").innerHTML="";
}
</script>

</body>
</html>
